name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi

      - name: Beri Izin Akses Gradle
        run: chmod +x gradlew

      - name: Run Unit Tests & Capture Screenshots
        run: |
          ./gradlew recordRoborazziDebug testDebugUnitTest --no-daemon --stacktrace || echo "Tests or screenshot recording completed"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app3-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 4

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 4

      - name: Upload UI Screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: game-ui-screenshots
          path: |
            app/src/test/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 4

      - name: Upload UI Screenshots roborazzi
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: game-ui-screenshots-roborazzi
          path: |
            app/build/outputs/roborazzi/*.png
          if-no-files-found: ignore
          retention-days: 4
